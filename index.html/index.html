<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Blast Deluxe</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f1020;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .game-container {
            text-align: center;
            background: #161b33;
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #ff3366;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,51,102,0.4);
        }

        .score-board {
            font-size: 18px;
            margin-bottom: 20px;
            color: #a0aec0;
            font-weight: 500;
        }

        #score {
            color: #4ecca3;
            font-weight: 700;
            font-size: 22px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            gap: 4px;
            width: 352px;
            height: 352px;
            background: #0b0f19;
            margin: 0 auto 20px auto;
            padding: 6px;
            border-radius: 12px;
            border: 2px solid #232d4f;
        }

        .cell {
            background: #1a2238;
            border-radius: 6px;
            transition: background 0.15s ease, transform 0.15s ease;
        }

        .cell.highlight {
            background: rgba(255, 255, 255, 0.25) !important;
            transform: scale(0.95);
        }

        /* Кольорові стилі для блоків */
        .color-1 { background: #ff3366; box-shadow: inset 0 0 8px rgba(0,0,0,0.3), 0 0 8px rgba(255,51,102,0.5); }
        .color-2 { background: #33ccff; box-shadow: inset 0 0 8px rgba(0,0,0,0.3), 0 0 8px rgba(51,204,255,0.5); }
        .color-3 { background: #ffcc00; box-shadow: inset 0 0 8px rgba(0,0,0,0.3), 0 0 8px rgba(255,204,0,0.5); }
        .color-4 { background: #9933ff; box-shadow: inset 0 0 8px rgba(0,0,0,0.3), 0 0 8px rgba(153,51,255,0.5); }
        .color-5 { background: #33ff99; box-shadow: inset 0 0 8px rgba(0,0,0,0.3), 0 0 8px rgba(51,255,153,0.5); }

        .pieces-container {
            display: flex;
            justify-content: space-around;
            align-items: center;
            min-height: 110px;
            background: #0b0f19;
            border-radius: 12px;
            padding: 10px;
            border: 2px solid #232d4f;
        }

        .piece-slot {
            width: 90px;
            height: 90px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .piece-slot:hover {
            background: rgba(255,255,255,0.03);
        }

        .piece-slot.selected {
            background: rgba(255, 51, 102, 0.15);
            border: 2px dashed #ff3366;
        }

        .mini-grid {
            display: grid;
            gap: 2px;
        }

        .mini-cell {
            width: 18px;
            height: 18px;
            background: transparent;
            border-radius: 3px;
        }

        /* Ефекти анімації зникнення лінії */
        @keyframes lineClear {
            0% { transform: scale(1); background: #ffffff; filter: brightness(2); }
            50% { transform: scale(1.15); filter: brightness(3); }
            100% { transform: scale(0); opacity: 0; }
        }

        .clearing {
            animation: lineClear 0.35s ease-out forwards;
        }

        .game-over {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(11, 16, 25, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .game-over.hidden {
            display: none;
        }

        .game-over h2 {
            font-size: 34px;
            margin-bottom: 15px;
            color: #ff3366;
            text-shadow: 0 0 15px rgba(255,51,102,0.5);
        }

        .game-over p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #a0aec0;
        }

        .game-over button {
            padding: 12px 28px;
            font-size: 18px;
            font-weight: 600;
            background: #ff3366;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255,51,102,0.4);
            transition: background 0.2s, transform 0.1s;
        }

        .game-over button:hover {
            background: #e62e5c;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>BLOCK BLAST</h1>
        <div class="score-board">Рахунок: <span id="score">0</span></div>
        
        <div id="grid" class="grid"></div>
        <div id="pieces-container" class="pieces-container"></div>
        
        <div id="game-over" class="game-over hidden">
            <h2>Гра закінчена!</h2>
            <p>Ваш рахунок: <span id="final-score">0</span></p>
            <button onclick="restartGame()">Грати знову</button>
        </div>
    </div>

    <script>
        const GRID_SIZE = 8;
        let board = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0));
        let score = 0;
        let currentPieces = [null, null, null];

        // Розширений набір різноманітних фігур з різними кольорами (значення від 1 до 5)
        const SHAPES = [
            // 1x1
            { shape: [[1]], color: 1 },
            // 2x2 квадрат
            { shape: [[2, 2], [2, 2]], color: 2 },
            // 3x3 квадрат
            { shape: [[3, 3, 3], [3, 3, 3], [3, 3, 3]], color: 3 },
            // Горизонтальні лінії
            { shape: [[4, 4]], color: 4 },
            { shape: [[5, 5, 5]], color: 5 },
            { shape: [[1, 1, 1, 1]], color: 1 },
            // Вертикальні лінії
            { shape: [[2], [2]], color: 2 },
            { shape: [[3], [3], [3]], color: 3 },
            { shape: [[4], [4], [4], [4]], color: 4 },
            // Куточки (L-подібні)
            { shape: [[5, 0], [5, 5]], color: 5 },
            { shape: [[1, 1], [1, 0]], color: 1 },
            { shape: [[0, 2], [2, 2]], color: 2 },
            // T-подібні фігури
            { shape: [[3, 3, 3], [0, 3, 0]], color: 3 },
            { shape: [[0, 4, 0], [4, 4, 4]], color: 4 },
            // Z-подібні фігури
            { shape: [[5, 5, 0], [0, 5, 5]], color: 5 },
            { shape: [[0, 1, 1], [1, 1, 0]], color: 1 }
        ];

        const gridEl = document.getElementById('grid');
        const scoreEl = document.getElementById('score');
        const finalScoreEl = document.getElementById('final-score');
        const piecesContainerEl = document.getElementById('pieces-container');
        const gameOverEl = document.getElementById('game-over');

        let selectedPieceIndex = null;

        function initGame() {
            board = Array(GRID_SIZE).fill(0).map(() => Array(GRID_SIZE).fill(0));
            score = 0;
            scoreEl.textContent = score;
            gameOverEl.classList.add('hidden');
            createGridDOM();
            generateNewPieces();
        }

        function createGridDOM() {
            gridEl.innerHTML = '';
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    cell.addEventListener('mouseenter', () => highlightCell(r, c));
                    cell.addEventListener('mouseleave', clearHighlight);
                    cell.addEventListener('click', () => placePieceOnBoard(r, c));

                    gridEl.appendChild(cell);
                }
            }
        }

        function generateNewPieces() {
            currentPieces = [];
            for (let i = 0; i < 3; i++) {
                const randomItem = SHAPES[Math.floor(Math.random() * SHAPES.length)];
                // Клонуємо об'єкт фігури, щоб не змінювати оригінал
                currentPieces.push({
                    shape: randomItem.shape,
                    color: randomItem.color
                });
            }
            renderPieces();
            checkGameOver();
        }

        function renderPieces() {
            piecesContainerEl.innerHTML = '';
            currentPieces.forEach((pieceObj, index) => {
                const slot = document.createElement('div');
                slot.classList.add('piece-slot');
                if (selectedPieceIndex === index) {
                    slot.classList.add('selected');
                }
                
                if (pieceObj !== null) {
                    const shape = pieceObj.shape;
                    const colorId = pieceObj.color;
                    
                    const miniGrid = document.createElement('div');
                    miniGrid.classList.add('mini-grid');
                    const rows = shape.length;
                    const cols = shape[0].length;
                    miniGrid.style.gridTemplateColumns = `repeat(${cols}, 18px)`;
                    miniGrid.style.gridTemplateRows = `repeat(${rows}, 18px)`;

                    shape.forEach((row) => {
                        row.forEach((val) => {
                            const miniCell = document.createElement('div');
                            miniCell.classList.add('mini-cell');
                            if (val !== 0) {
                                miniCell.classList.add(`color-${colorId}`);
                            }
                            miniGrid.appendChild(miniCell);
                        });
                    });

                    slot.appendChild(miniGrid);
                    slot.addEventListener('click', () => {
                        selectedPieceIndex = index;
                        renderPieces();
                    });
                }
                piecesContainerEl.appendChild(slot);
            });
        }

        function highlightCell(r, c) {
            if (selectedPieceIndex === null || currentPieces[selectedPieceIndex] === null) return;
            const pieceObj = currentPieces[selectedPieceIndex];
            const shape = pieceObj.shape;
            
            clearHighlight();

            let canPlace = true;
            for (let sr = 0; sr < shape.length; sr++) {
                for (let sc = 0; sc < shape[sr].length; sc++) {
                    if (shape[sr][sc] !== 0) {
                        let targetR = r + sr;
                        let targetC = c + sc;
                        if (targetR >= GRID_SIZE || targetC >= GRID_SIZE || board[targetR][targetC] !== 0) {
                            canPlace = false;
                        }
                    }
                }
            }

            if (canPlace) {
                for (let sr = 0; sr < shape.length; sr++) {
                    for (let sc = 0; sc < shape[sr].length; sc++) {
                        if (shape[sr][sc] !== 0) {
                            let targetR = r + sr;
                            let targetC = c + sc;
                            const cell = document.querySelector(`.cell[data-row='${targetR}'][data-col='${targetC}']`);
                            if (cell) cell.classList.add('highlight');
                        }
                    }
                }
            }
        }

        function clearHighlight() {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('highlight'));
        }

        function placePieceOnBoard(r, c) {
            if (selectedPieceIndex === null || currentPieces[selectedPieceIndex] === null) return;
            const pieceObj = currentPieces[selectedPieceIndex];
            const shape = pieceObj.shape;
            const colorId = pieceObj.color;

            let canPlace = true;
            for (let sr = 0; sr < shape.length; sr++) {
                for (let sc = 0; sc < shape[sr].length; sc++) {
                    if (shape[sr][sc] !== 0) {
                        let targetR = r + sr;
                        let targetC = c + sc;
                        if (targetR >= GRID_SIZE || targetC >= GRID_SIZE || board[targetR][targetC] !== 0) {
                            canPlace = false;
                        }
                    }
                }
            }

            if (!canPlace) return;

            // Розміщуємо фігуру
            let blocksCount = 0;
            for (let sr = 0; sr < shape.length; sr++) {
                for (let sc = 0; sc < shape[sr].length; sc++) {
                    if (shape[sr][sc] !== 0) {
                        board[r + sr][c + sc] = colorId;
                        blocksCount++;
                    }
                }
            }

            score += blocksCount * 10;
            currentPieces[selectedPieceIndex] = null;
            selectedPieceIndex = null;

            updateBoardDOM();
            
            // Перевіряємо лінії з невеликою затримкою для плавності
            setTimeout(() => {
                checkLines();
            }, 50);
        }

        function updateBoardDOM() {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.querySelector(`.cell[data-row='${r}'][data-col='${c}']`);
                    cell.className = 'cell'; // скидаємо класи
                    if (board[r][c] !== 0) {
                        cell.classList.add(`color-${board[r][c]}`);
                    }
                }
            }
            scoreEl.textContent = score;
        }

        function checkLines() {
            let rowsToClear = [];
            let colsToClear = [];

            // Пошук заповнених рядків
            for (let r = 0; r < GRID_SIZE; r++) {
                if (board[r].every(val => val !== 0)) {
                    rowsToClear.push(r);
                }
            }

            // Пошук заповнених стовпчиків
            for (let c = 0; c < GRID_SIZE; c++) {
                let colFilled = true;
                for (let r = 0; r < GRID_SIZE; r++) {
                    if (board[r][c] === 0) colFilled = false;
                }
                if (colFilled) colsToClear.push(c);
            }

            if (rowsToClear.length > 0 || colsToClear.length > 0) {
                // Додаємо анімаційний клас лініям
                let cellsToAnimate = new Set();
                rowsToClear.forEach(r => {
                    for (let c = 0; c < GRID_SIZE; c++) cellsToAnimate.add(`${r}-${c}`);
                });
                colsToClear.forEach(c => {
                    for (let r = 0; r < GRID_SIZE; r++) cellsToAnimate.add(`${r}-${c}`);
                });

                cellsToAnimate.forEach(coord => {
                    let [r, c] = coord.split('-').map(Number);
                    const cell = document.querySelector(`.cell[data-row='${r}'][data-col='${c}']`);
                    if (cell) cell.classList.add('clearing');
                });

                setTimeout(() => {
                    rowsToClear.forEach(r => {
                        for (let c = 0; c < GRID_SIZE; c++) board[r][c] = 0;
                    });
                    colsToClear.forEach(c => {
                        for (let r = 0; r < GRID_SIZE; r++) board[r][c] = 0;
                    });

                    // Бонусні бали за очищення
                    let linesCount = rowsToClear.length + colsToClear.length;
                    score += linesCount * 100 * (linesCount > 1 ? 1.5 : 1);
                    
                    updateBoardDOM();
                    checkAfterTurn();
                }, 300);
            } else {
                checkAfterTurn();
            }
        }

        function checkAfterTurn() {
            if (currentPieces.every(p => p === null)) {
                generateNewPieces();
            } else {
                renderPieces();
                checkGameOver();
            }
        }

        function checkGameOver() {
            let possibleMove = false;
            for (let pieceObj of currentPieces) {
                if (pieceObj === null) continue;
                let shape = pieceObj.shape;
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (canFit(shape, r, c)) {
                            possibleMove = true;
                            break;
                        }
                    }
                    if (possibleMove) break;
                }
                if (possibleMove) break;
            }

            if (!possibleMove && currentPieces.some(p => p !== null)) {
                finalScoreEl.textContent = score;
                gameOverEl.classList.remove('hidden');
            }
        }

        function canFit(shape, r, c) {
            for (let sr = 0; sr < shape.length; sr++) {
                for (let sc = 0; sc < shape[sr].length; sc++) {
                    if (shape[sr][sc] !== 0) {
                        let targetR = r + sr;
                        let targetC = c + sc;
                        if (targetR >= GRID_SIZE || targetC >= GRID_SIZE || board[targetR][targetC] !== 0) {
                            return false;
                        }
                    }
                }
            }
            return true;
        }

        function restartGame() {
            initGame();
        }

        initGame();
    </script>
</body>
</html>
